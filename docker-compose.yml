version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sahyadrushti_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sahyadri_admin
      POSTGRES_PASSWORD: sahyadri_secure_postgres_pass_2026
      POSTGRES_DB: sahyadrushti_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahyadri_admin -d sahyadrushti_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sahyadrushti_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      APP_VERSION: "2.1.0"
      DATABASE_URL: "postgresql+psycopg://sahyadri_admin:sahyadri_secure_postgres_pass_2026@db:5432/sahyadrushti_db"
      JWT_SECRET: "sahyadrushti_production_container_secret_key_32_bytes_min"
      JWT_ALGORITHM: "HS256"
      JWT_ACCESS_TOKEN_MINUTES: "30"
      JWT_REFRESH_TOKEN_DAYS: "7"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      WEATHER_MODE: "live"
      SCHEDULER_ENABLED: "True"
      WEATHER_FETCH_INTERVAL_MINUTES: "30"
      WEATHER_CACHE_TTL_MINUTES: "15"
      BIAS_MULTIPLIER: "1.0"
      RATELIMIT_ENABLED: "True"
      RATE_LIMIT_LOGIN: "5/minute"
      RATE_LIMIT_REFRESH: "10/minute"
      RATE_LIMIT_PUBLIC_POST: "10/minute"
      RATE_LIMIT_PREDICT: "30/minute"
      RATE_LIMIT_SIMULATE: "20/minute"

volumes:
  pgdata:
    driver: local

